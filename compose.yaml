name: gophprofile

x-app: &app
  image: gophprofile:local
  build: .
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  labels:
    gophprofile.logs: "true"
  environment: &app-env
    APP_MODE: production
    HTTP_ADDR: :8080
    DATABASE_URL: postgres://gophprofile:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/gophprofile?sslmode=disable
    KAFKA_BROKERS: kafka:9092
    KAFKA_TOPIC: avatar-events
    KAFKA_GROUP_ID: avatar-workers
    S3_ENDPOINT: minio:9000
    S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    S3_BUCKET: avatars
    S3_USE_SSL: "false"
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-120}
    RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1m}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
    minio:
      condition: service_started

services:
  server:
    <<: *app
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: gophprofile-server
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    healthcheck:
      test: [CMD, /app/server, -healthcheck]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    entrypoint: [/app/worker]
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: gophprofile-worker
      METRICS_ADDR: :9091
    ports:
      - "127.0.0.1:${WORKER_METRICS_PORT:-9091}:9091"

  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    mem_limit: 384m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1d
      - --storage.tsdb.retention.size=512MB
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    depends_on:
      - server
      - worker
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.35.0
    restart: unless-stopped
    mem_limit: 96m
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./observability/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager

  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    mem_limit: 768m
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - jaeger

  jaeger:
    # 2.21 removed the legacy search API still used by Grafana's Jaeger plugin.
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    restart: unless-stopped
    mem_limit: 256m
    environment:
      OTEL_TRACES_SAMPLER: always_off
    command: [--config=/etc/jaeger/config.yaml]
    ports:
      - "127.0.0.1:${JAEGER_PORT:-16686}:16686"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./observability/jaeger/config.yaml:/etc/jaeger/config.yaml:ro

  loki:
    image: grafana/loki:3.6.21
    restart: unless-stopped
    mem_limit: 384m
    command: [-config.file=/etc/loki/config.yaml]
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - ./observability/loki/rules:/etc/loki/rules:ro
      - loki-data:/loki
    depends_on:
      - alertmanager

  alloy:
    image: grafana/alloy:v1.21.3
    restart: unless-stopped
    mem_limit: 192m
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: gophprofile
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: gophprofile
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U gophprofile -d gophprofile"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: gophprofile-minio:local
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  kafka:
    image: apache/kafka:4.1.1
    hostname: kafka
    ports:
      - "127.0.0.1:19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

volumes:
  postgres-data:
  minio-data:
  kafka-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  alloy-data:
