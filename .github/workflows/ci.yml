name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go run scripts/check_comments.go
      - run: go test -race ./...
      - run: go test -race -tags=integration ./internal/adapters/kafka
      - run: make coverage
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - run: go build ./cmd/...
      - run: docker compose config -q
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: go test -race -tags=integration ./internal/adapters/postgres ./internal/adapters/s3
        env:
          POSTGRES_INTEGRATION_URL: postgres://gophprofile:gophprofile_dev@localhost:5432/gophprofile?sslmode=disable
          S3_INTEGRATION_ENDPOINT: localhost:9000
      - run: python3 scripts/smoke.py
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
